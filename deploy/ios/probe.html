<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; media-src blob:"
    />
    <title>爱拼音 iOS 工程验证</title>
    <style>
      @font-face {
        font-family: ProbeAndika;
        src: url('./fonts/andika/Andika-Regular.woff2') format('woff2');
      }
      #pinyin {
        font:
          2rem ProbeAndika,
          sans-serif;
      }
      body {
        font: 1.125rem system-ui;
        margin: 1.5rem auto;
        padding: 0 1rem;
        max-width: 40rem;
      }
      button {
        display: block;
        min-height: 48px;
        margin-block: 0.75rem;
        font: inherit;
      }
    </style>
    <script type="module" src="./probe.js"></script>
  </head>
  <body>
    <h1>爱拼音 iOS 工程验证</h1>
    <p id="pinyin" lang="zh-Latn">ā á ǎ à · gǔ · lǜ</p>
    <p id="status" role="status">正在读取离线课程…</p>
    <button id="short" type="button">播放拼音示范</button>
    <button id="long" type="button">播放课程录音</button>
    <button id="seek" type="button">跳到第 10 秒</button>
    <button id="stop" type="button">停止播放</button>
    <audio id="sample"></audio>
  </body>
</html>
