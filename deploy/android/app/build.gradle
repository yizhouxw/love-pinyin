plugins { id 'com.android.application' }
android {
 namespace 'org.lovepinyin.android'
 compileSdk { version = release(36) { minorApiLevel = 1 } }
 buildToolsVersion '36.0.0'
 defaultConfig { applicationId 'org.lovepinyin.android'; minSdk 26; targetSdk 36; versionCode 1; versionName '0.10.0' }
 compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
android { androidResources { noCompress += ['mp3', 'm4a', 'wav'] } }
android { defaultConfig { testInstrumentationRunner 'org.lovepinyin.android.ContractInstrumentation' } }
