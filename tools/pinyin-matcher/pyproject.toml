[project]
name = "love-pinyin-matcher-tools"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "scipy==1.18.1",
  "onnxruntime==1.31.0",
]

[dependency-groups]
train = ["torch==2.8.0", "onnx==1.23.2", "librosa==1.0.0"]
dev = ["pytest==9.1.1", "ruff==0.17.1", "pypinyin==0.55.0"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
