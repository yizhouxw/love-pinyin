[project]
name = "love-pinyin-pretrained-research"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.8.0",
  "torchaudio==2.8.0",
  "transformers==4.57.1",
  "huggingface-hub==0.36.0",
  "safetensors==0.6.2",
  "numpy==2.5.4",
  "scipy==1.18.1",
  "onnx==1.23.2",
  "onnxruntime==1.31.0",
  "pypinyin==0.55.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1"]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
