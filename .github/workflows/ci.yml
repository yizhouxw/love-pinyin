name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --locked
      - run: npm run verify
      - run: npm run verify:server
      - run: npm run licenses
      - run: git diff --exit-code -- docs/engineering/dependency-inventory.json
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      # Real GUI/product tests require prepared private speech assets on the Mac.
      # Linux CI does not replace them with fake speech or claim audio acceptance.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
