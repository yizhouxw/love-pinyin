name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --locked
      - run: npm run verify
      - run: npm run verify:server
      - run: npm run licenses
      - run: git diff --exit-code -- docs/engineering/dependency-inventory.json
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      # Real GUI/product tests require prepared private speech assets on the Mac.
      # Linux CI does not replace them with fake speech or claim audio acceptance.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
