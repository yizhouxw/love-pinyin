name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@11.16.0
      - run: npm ci
      - uses: astral-sh/setup-uv@eb1897b8dc4b5d5bfe39a428a8f2304605e0983c # v7.0.0
        with:
          version: '0.12.5'
          enable-cache: true
      - run: uv sync --locked
      - run: npm run verify
      - run: npm run verify:server
      - run: npm run licenses
      - run: git diff --exit-code -- docs/engineering/dependency-inventory.json
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e
      # Real GUI/product tests require prepared private speech assets on the Mac.
      # Linux CI does not replace them with fake speech or claim audio acceptance.
      - uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
